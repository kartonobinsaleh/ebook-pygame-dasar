<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background (Dark Blue, rounded) -->
  <rect width="100" height="100" rx="20" fill="#0F172A" />
  
  <!-- Paddle (Green) -->
  <rect x="25" y="75" width="50" height="12" rx="4" fill="#28C850" />
  
  <!-- Ball (Red) -->
  <circle cx="50" cy="45" r="14" fill="#E63232" />
  
  <!-- Motion trail (Subtle line) -->
  <path d="M50 15 L50 31" stroke="#E63232" stroke-width="4" stroke-dasharray="4,4" opacity="0.5" stroke-linecap="round" />
</svg>